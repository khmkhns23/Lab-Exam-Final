# ==========================================================
# Nginx Config บนเครื่อง k8s-lb (192.168.1.20) สำหรับ Linux / VMware
# วางไว้ที่: /etc/nginx/conf.d/iam-239-ingress.conf
# ทำหน้าที่ส่งต่อทราฟฟิกพอร์ต 80 ไปยัง NGINX Ingress Controller (NodePort 31080)
# ==========================================================

upstream k8s_ingress_nodes {
    server 192.168.1.11:31080 max_fails=2 fail_timeout=5s;
    server 192.168.1.12:31080 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name www.iam-239.com admin.iam-239.com;
    client_max_body_size 10m;

    access_log /var/log/nginx/iam-239-access.log;
    error_log  /var/log/nginx/iam-239-error.log;

    location / {
        proxy_pass http://k8s_ingress_nodes;
        # สำคัญมาก: ต้องส่ง Host Header เดิมไปด้วยเพื่อให้ Ingress แยก www กับ admin ได้
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
