# ==========================================================
# Nginx External LB Config for local kind-k8s-lab cluster
# Mounted into container k8s-lb-iam239 (network: kind, port 80)
# ==========================================================

upstream k8s_ingress_nodes {
    server k8s-lab-worker:31080 max_fails=2 fail_timeout=5s;
    server k8s-lab-worker2:31080 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name www.iam-239.com admin.iam-239.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://k8s_ingress_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
