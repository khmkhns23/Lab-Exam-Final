apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-239
  namespace: iam-239
  labels:
    app: admin-239
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-239
  template:
    metadata:
      labels:
        app: admin-239
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-lab-worker
      containers:
        - name: python-admin
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PORTAL_DIR
              value: "/data/portal"
            - name: RESEARCH_FILE
              value: "/data/research/research.txt"
            - name: DEFAULT_AVATAR
              value: "/app/avatar.svg"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: portal-data
              mountPath: /data/portal
            - name: research-data
              mountPath: /data/research
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"
      volumes:
        - name: app-code
          configMap:
            name: admin-239-code
        - name: portal-data
          persistentVolumeClaim:
            claimName: portal-pvc-239
        - name: research-data
          persistentVolumeClaim:
            claimName: research-pvc-239
---
apiVersion: v1
kind: Service
metadata:
  name: svc-admin-239
  namespace: iam-239
spec:
  type: ClusterIP
  selector:
    app: admin-239
  ports:
    - port: 80
      targetPort: 8080
