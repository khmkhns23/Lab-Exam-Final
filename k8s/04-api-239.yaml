apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-239
  namespace: iam-239
  labels:
    app: api-239
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-239
  template:
    metadata:
      labels:
        app: api-239
    spec:
      containers:
        - name: python-api
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /api-239/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"
      volumes:
        - name: app-code
          configMap:
            name: api-239-code
---
apiVersion: v1
kind: Service
metadata:
  name: svc-api-239
  namespace: iam-239
spec:
  type: ClusterIP
  selector:
    app: api-239
  ports:
    - port: 80
      targetPort: 8080
