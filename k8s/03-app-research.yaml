apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-research
  namespace: iam-239
  labels:
    app: app-research
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-research
  template:
    metadata:
      labels:
        app: app-research
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-lab-worker
      containers:
        - name: python-research
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: RESEARCH_FILE
              value: "/data/research/research.txt"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: research-data
              mountPath: /data/research
          readinessProbe:
            httpGet:
              path: /research
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"
      volumes:
        - name: app-code
          configMap:
            name: app-research-code
        - name: research-data
          persistentVolumeClaim:
            claimName: research-pvc-239
---
apiVersion: v1
kind: Service
metadata:
  name: svc-research
  namespace: iam-239
spec:
  type: ClusterIP
  selector:
    app: app-research
  ports:
    - port: 80
      targetPort: 8080
